[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "egorecall"
version = "0.1.0"
description = "Data access for the EgoRecall temporal grounding benchmark"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pyarrow>=18"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.11"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: requires a local EgoRecall package via EGORECALL_TEST_DATASET"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "E501", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
